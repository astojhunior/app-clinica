# --- 1. Identificación del proyecto ---
sonar.projectKey=Clinica_Calidad
sonar.projectName=Clinica Calidad Laravel
sonar.projectVersion=1.0

# --- 2. Lenguaje principal ---
sonar.language=php

# --- 3. Rutas (ajustadas para Laravel) ---
sonar.sources=app,routes,database,resources

# --- 4. Codificación por defecto ---
sonar.sourceEncoding=UTF-8

# --- 5. Exclusiones recomendadas ---
sonar.exclusions=vendor/**,node_modules/**,storage/**,bootstrap/cache/**,config/**,public/**,tests/**,resources/views/**

# Puedes excluir vistas si no quieres medir HTML/Blade.
# Agrega más directorios si usas otros frameworks o personalizaciones.

# --- 6. Conexión al servidor ---
sonar.host.url=http://localhost:9000

# --- 7. Autenticación ---
# Recomendado: Usa el token solo al ejecutar el scanner (no en el archivo por seguridad).
# Pero si quieres automatizar, puedes:
sonar.login=sqp_fdc724de4772ffda79d831d978d75f349f90077e

# --- 8. Otras opciones útiles ---
# Si usas PHPUnit para tests, pon la ruta al reporte (ajusta si tienes coverage):
# sonar.tests=tests
# sonar.php.coverage.reportPaths=storage/coverage/phpunit.coverage.xml

# Si usas ESLint, PHPStan, etc. puedes agregar reportes aquí también.

# --- 9. Opciones para proyectos con frontend ---
# Si tienes JS, puedes agregar:
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
# sonar.ts.lcov.reportPaths=coverage/lcov.info

# --- 10. Datos adicionales ---
# Puedes personalizar aún más según paquetes, plugins o arquitectura.
sonar.phpstan.reportPaths=phpstan-sonar-report.json
sonar.phpstan.reportPaths=phpstan-report.xml
